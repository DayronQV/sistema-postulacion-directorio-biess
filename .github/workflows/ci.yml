name: CI

# Pruebas, lint y compilación de backend y frontend en cada PR y en cada push a
# develop y main. Los mismos comandos se pueden correr en local (ver README).
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Una ejecución nueva del mismo PR cancela la anterior; en develop y main no se cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # Con PostgreSQL y Redis reales las pruebas de integración corren de verdad
    # (catálogos con "Ecuador primero", bloqueo por intentos, caché con TTL);
    # sin ellos se saltarían en silencio.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biess
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: biess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biess -d biess"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://biess:ci_password@localhost:5432/biess?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Cargar esquema y semilla
        working-directory: .
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
