server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los archivos compilados llevan hash en el nombre: se pueden guardar un año.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback de la SPA: cualquier ruta que no sea un archivo devuelve index.html
    # y React Router resuelve la pantalla. El index no se guarda en caché para que
    # un despliegue nuevo se vea de inmediato.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
